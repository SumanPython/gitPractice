name: HTML Validation
on: 
    push:
    pull_request:
       

jobs:
    validate-html:
        runs-on: ubuntu-latest
        steps: 
            - name: checkout repository
              uses: actions/checkout@v4

            - name: show files
              run: ls  

            - name: Install tidy
              run: sudo apt-get update && sudo apt-get install -y tidy

            - name: validate index.html
              run: tidy -q -e index.html

            - name: create report
              run: echo "HTML Validation Successful" > report.txt

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                name: html-report
                path: report.txt

    project-info:
      needs: validate-html
      runs-on: ubuntu-latest
      steps:
        - name: Display project message
          run: echo "This is a sample project for HTML validation using GitHub Actions"
          
        - name: Download report artifact
          uses: actions/download-artifact@v4
          with:
            name: html-report
            path: report.txt