name: HTML Validation
on: 
    push:
      branches:
        - login

    pull_request:
      branches:
        - master
       
    workflow_dispatch:
      
jobs:
    validate-html:
        runs-on: ubuntu-latest
        steps: 
            - name: checkout repository
              uses: actions/checkout@v4

            - name: show files
              run: ls  

            - name: Install tidy
              run: sudo apt-get update && sudo apt-get install -y tidy

            - name: validate index.html
              run: tidy -q -e index.html

            - name: Run basic tests
              run: |
                test -f missing.html
                grep -qi "<title>" index.html
                echo "Basic tests passed"

            - name: check github secret
              env:
                PRACTICE_SECRET: ${{ secrets.MY_SECRET }}
              run: |
                if [ -n "$PRACTICE_SECRET" ]; then
                 echo "Secret is available" 
                else
                 echo "Secret is missing"
                 exit 1
                fi

            - name: create report
              run: echo "HTML Validation Successful" > report.txt

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                name: html-report
                path: report.txt

    project-info:
      needs: validate-html
      runs-on: ubuntu-latest
      steps:
        - name: Display project message
          run: echo "This is a sample project for HTML validation using GitHub Actions"
          
        - name: Download report artifact
          uses: actions/download-artifact@v4
          with:
            name: html-report
            path: .
        - name: read report content
          run: cat report.txt